name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test protocol library
        run: dotnet test windows/BluntyBuds.Proto.Tests -c Release
      - name: Build Windows app
        run: dotnet build windows/BluntyBuds.Win -c Release
      - name: Build Probe
        run: dotnet build windows/Probe -c Release
      - name: Publish single-file exe
        run: dotnet publish windows/BluntyBuds.Win -c Release -o windows/installer/dist
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          [xml]$p = Get-Content windows/BluntyBuds.Win/BluntyBuds.Win.csproj
          $ver = ($p.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          & $iscc /Q "/DAppVersion=$ver" windows/installer/BluntyBuds.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BluntyBuds-setup
          path: windows/installer/Output/*.exe

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build (no signing)
        run: ./gradlew --no-daemon testReleaseUnitTest assembleDebug
