name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test protocol library
        run: dotnet test windows/BluntyBuds.Proto.Tests -c Release
      - name: Build Windows app
        run: dotnet build windows/BluntyBuds.Win -c Release
      - name: Build Probe
        run: dotnet build windows/Probe -c Release

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build (no signing)
        run: ./gradlew --no-daemon testReleaseUnitTest assembleDebug
